<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Code Challenges</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>🏆 Real-World <span class="accent">Challenges</span></h1>
      <p>Games done? Now use the real Claude Code! Each challenge has steps and a "you did it if..." check. Tick them off as you go.</p>
      <p id="done" class="star-count" style="display:inline-block"></p>
    </section>
    <section id="list"></section>
  </main>
  <footer><a href="index.html">⟵ Back to the map</a></footer>

  <script src="js/game.js"></script>
  <script src="js/challenges-data.js"></script>
  <script>
    (function () {
      var C = window.CCQ, KEY = "ccq-challenges-v1", done = {};
      C.topbar("");
      try { done = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
      var colors = { Beginner: "c-mint", Intermediate: "c-sky", Advanced: "c-lilac", Expert: "c-peach" };
      var list = document.getElementById("list");
      function count() {
        var n = Object.keys(done).filter(function (k) { return done[k]; }).length;
        document.getElementById("done").textContent = "✅ " + n + " / " + window.CHALLENGES.length + " challenges done";
      }
      window.CHALLENGES.forEach(function (ch) {
        var steps = C.el("ol");
        ch.steps.forEach(function (s) { steps.appendChild(C.el("li", { text: s })); });
        var box = C.el("input", { type: "checkbox" });
        box.checked = !!done[ch.id];
        box.addEventListener("change", function () {
          done[ch.id] = box.checked;
          try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {}
          if (box.checked) C.confetti();
          count();
        });
        list.appendChild(C.el("article", { class: "panel challenge" }, [
          C.el("div", { class: "icon", text: ch.icon }),
          C.el("div", {}, [
            C.el("h3", { text: ch.id + ". " + ch.name }),
            C.el("div", {}, [
              C.el("span", { class: "tag " + colors[ch.level], text: ch.level }),
              C.el("span", { class: "tag", text: "Uses level " + ch.levels })
            ]),
            C.el("p", { html: "<b>Goal:</b> " }),
            steps,
            C.el("p", { html: "<b>You did it if:</b> " }),
            C.el("p", { html: "<b>Features:</b> " }),
            C.el("label", {}, [box, "I finished this challenge!"])
          ])
        ]));
        var ps = list.lastChild.querySelectorAll("p");
        ps[0].appendChild(document.createTextNode(ch.goal));
        ps[1].appendChild(document.createTextNode(ch.success));
        ps[2].appendChild(document.createTextNode(ch.features.join(" • ")));
      });
      count();
    })();
  </script>
</body>
</html>
