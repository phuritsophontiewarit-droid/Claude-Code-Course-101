<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick a Playground | Claude Code Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="wrap" id="game"></main>
  <footer><a href="../index.html">⟵ Back to the map</a></footer>
  <script src="../js/game.js"></script>
  <script>
CCQ.runLevel({
  id: "l2",
  intro: "Claude Code can live in lots of places. We call them <b>surfaces</b>. Same brain, different playgrounds!",
  story: [
    { emoji: "⌨️", title: "Do I need an IDE?", body: "<p><b>No!</b> An IDE is an app for writing code. Claude Code does <b>not</b> need one. The main version runs in any <b>terminal</b> (the black window where you type commands).</p><p>If you like IDEs, you can <b>add</b> Claude Code to one as an extension or plugin.</p>" },
    { emoji: "🟦", title: "VS Code and friends", body: "<p>The <b>VS Code extension</b> gives Claude a panel right inside the editor with inline diffs, @-mentions and plan review. It needs VS Code 1.94 or newer.</p><p>It also installs in VS Code look-alikes such as <b>Cursor</b> and <b>Kiro</b>.</p>" },
    { emoji: "🧠", title: "JetBrains IDEs", body: "<p>A <b>JetBrains plugin</b> works in IntelliJ IDEA, PyCharm, Android Studio, WebStorm, PhpStorm, GoLand and more.</p><p>The plugin needs the Claude Code <b>command-line tool installed separately</b>.</p>" },
    { emoji: "🖥️", title: "Desktop, Web and Phone", body: "<p><b>Desktop app</b> (macOS, Windows, Linux beta): open the <b>Code</b> tab. No separate install needed.</p><p><b>Web</b>: go to <code>claude.ai/code</code>. Claude works in the cloud, no setup on your computer.</p><p><b>Mobile</b>: the Claude app for iOS and Android can start and check on tasks.</p>" },
    { emoji: "🔌", title: "Even more places", body: "<p>Claude Code can also help from <b>GitHub Actions</b> and <b>GitLab CI/CD</b> (review pull requests automatically), <b>Slack</b> (mention @Claude with a bug), <b>Chrome</b> (debug a live web page) and the <b>Agent SDK</b> (build your own AI agent).</p>" }
  ],
  play: function (host, finish) {
    CCQ.match(host, [
      ["⌨️ Terminal (CLI)", "Type <code>claude</code> in any terminal. No IDE needed!"],
      ["🟦 VS Code extension", "Inline diffs and plan review inside VS Code or Cursor"],
      ["🧠 JetBrains plugin", "Works in IntelliJ IDEA, PyCharm and WebStorm"],
      ["🖥️ Desktop app", "Open the Code tab in the Claude app"],
      ["🌐 Web", "Run tasks in the cloud at claude.ai/code"],
      ["🐙 GitHub Actions", "Review pull requests automatically in CI"],
      ["💬 Slack", "Mention @Claude with a bug report, get a pull request back"]
    ], function (r) {
      finish(CCQ.stars3(r.mistakes, 1, 3), "Mistakes: " + r.mistakes + ". Remember: an IDE is <b>optional</b>. The terminal is enough!");
    }, ["Surface", "What it's like"]);
  }
});
  </script>
</body>
</html>
