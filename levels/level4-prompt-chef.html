<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Chef | Claude Code Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="wrap" id="game"></main>
  <footer><a href="../index.html">⟵ Back to the map</a></footer>
  <script src="../js/game.js"></script>
  <script>
CCQ.runLevel({
  id: "l4",
  intro: "A <b>prompt</b> is the message you send Claude. Great prompts are like great recipes: clear ingredients, clear steps!",
  story: [
    { emoji: "🎯", title: "Ingredient 1: Be specific", body: "<p>❌ <i>make it better</i></p><p>✅ <i>make the score text bigger and yellow in score.js</i></p><p>Say <b>what</b>, <b>where</b> and <b>how it should look</b>.</p>" },
    { emoji: "📎", title: "Ingredient 2: Point at files", body: "<p>Type <code>@</code> and a file name to show Claude exactly which file you mean, like <code>@src/player.js</code>.</p><p>You can also paste an error message or drop in a screenshot.</p>" },
    { emoji: "🧪", title: "Ingredient 3: Say how to check", body: "<p>Tell Claude how to prove it worked: <i>\"run the tests\"</i>, <i>\"open the page and check the button\"</i>. Claude does its best work when it can check itself.</p>" },
    { emoji: "🗺️", title: "Ingredient 4: Plan big jobs", body: "<p>For a big task, ask Claude to <b>make a plan first</b>. Press <b>Shift+Tab</b> to switch into <b>plan mode</b>: Claude reads and plans but doesn't change files until you approve.</p><p>Then build in small steps.</p>" }
  ],
  play: function (host, finish) {
    CCQ.builder(host, [
      { task: "The jump button in <code>game.html</code> is too small.", why: "Specific place, specific change, and a way to check!", pieces: [
        { t: "Make the jump button in @game.html", good: true },
        { t: "twice as big", good: true },
        { t: "then open the page to check it", good: true },
        { t: "do something cool idk", good: false, why: "Too vague. Claude can't guess what 'cool' means." },
        { t: "change every file randomly", good: false, why: "That could break the whole game!" }
      ] },
      { task: "Your game crashes with <code>TypeError: score is undefined</code>.", why: "Pasting the exact error and asking for a test is chef's kiss.", pieces: [
        { t: "Fix this error:", good: true },
        { t: "TypeError: score is undefined", good: true },
        { t: "and run the tests after", good: true },
        { t: "it's broken, fix", good: false, why: "Say WHAT is broken. The error message is the best clue." },
        { t: "delete the tests so they pass", good: false, why: "Never delete tests to hide a bug!" }
      ] },
      { task: "You want to add a whole new level with enemies.", why: "Big job + plan first + small steps = success.", pieces: [
        { t: "Plan first:", good: true },
        { t: "add level 2 with 3 slime enemies", good: true },
        { t: "build it one step at a time", good: true },
        { t: "write 10,000 levels right now", good: false, why: "Way too big for one go. Start small!" },
        { t: "skip checking anything", good: false, why: "Checking is how we know it works." }
      ] }
    ], function (r) {
      finish(CCQ.stars3(r.mistakes, 0, 2), "Kitchen mistakes: " + r.mistakes + ". You are now a certified Prompt Chef! 👩‍🍳");
    });
  }
});
  </script>
</body>
</html>
