<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Everywhere | Claude Code Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="wrap" id="game"></main>
  <footer><a href="../index.html">⟵ Back to the map</a></footer>
  <script src="../js/game.js"></script>
  <script>
CCQ.runLevel({
  id: "l7",
  intro: "Claude can keep working even when you're away! Meet the <b>big-kid features</b> of Claude and Claude Code.",
  story: [
    { emoji: "🗂️", title: "Projects", body: "<p>A <b>Project</b> is one ongoing conversation where Claude coordinates lots of related tasks. You drop in jobs and Claude starts a <b>thread</b> for each one, running them in parallel as cloud sessions that share the same repositories, instructions and memory.</p><p>The <b>Overview</b> shows what's finished and what's <b>waiting on you</b>. (Public beta on Pro and Max.)</p>" },
    { emoji: "🖼️", title: "Artifacts", body: "<p>An <b>artifact</b> is a live, interactive web page that Claude publishes from your session to a private link on claude.ai: a dashboard, a diagram, a game, a report. You can keep it private or share it.</p>" },
    { emoji: "⏰", title: "Scheduled work", body: "<ul><li><b>Routines</b> run in the cloud on a schedule (hourly, nightly, weekly), from an API call, or when something happens on GitHub. Make one at claude.ai/code/routines or with <code>/schedule</code>.</li><li><b>Desktop scheduled tasks</b> run on your own computer.</li><li><code>/loop</code> repeats a prompt inside one session.</li></ul>" },
    { emoji: "📱", title: "Work from anywhere", body: "<ul><li><b>Remote Control</b>: continue a session on your computer from your phone or a browser.</li><li><b>Web + mobile</b>: start a cloud task, then pull it into your terminal with <code>claude --teleport</code>.</li><li><b>Slack</b>: mention @Claude with a bug and get a pull request.</li><li><b>GitHub Code Review</b>: automatic review on every pull request.</li></ul>" }
  ],
  play: function (host, finish) {
    CCQ.quiz(host, [
      { q: "You want Claude to check your repo for problems <b>every morning at 8am</b>, even when your laptop is closed. What do you use?", choices: ["A routine (cloud schedule)", "An artifact", "Plan mode", "CLAUDE.md"], answer: 0, why: "Routines run on Anthropic's cloud on a schedule." },
      { q: "You want to share a <b>colorful live dashboard</b> of your results with a friend.", choices: ["Publish an artifact", "Press Esc", "Write a hook", "Run /clear"], answer: 0, why: "Artifacts are live pages with a private or shareable link." },
      { q: "You have <b>10 related tasks</b> for one app and want Claude to run them in parallel threads and tell you what needs you.", choices: ["Use a Project", "Use /compact", "Use one giant prompt", "Turn off the computer"], answer: 0, why: "Projects coordinate parallel threads that share context and memory." },
      { q: "You're on the bus and want to keep steering the session running on your home computer.", choices: ["Remote Control from your phone", "A JetBrains plugin", "A skill", "/init"], answer: 0, why: "Remote Control lets you continue a local session from phone or browser." },
      { q: "You want Claude to automatically review <b>every new pull request</b> on GitHub.", choices: ["GitHub Code Review or GitHub Actions", "Desktop app only", "/rewind", "CLAUDE.md alone"], answer: 0, why: "Code review on PRs can run automatically on GitHub." },
      { q: "Inside one session, you want Claude to re-check a build every few minutes.", choices: ["/loop", "An artifact", "A plugin marketplace", "Esc twice"], answer: 0, why: "/loop repeats a prompt inside your session." },
      { q: "Your teammate reports a bug in Slack. What's the fastest Claude path?", choices: ["Mention @Claude in Slack and get a pull request back", "Print the message and mail it", "Ignore it", "Rename the repo"], answer: 0, why: "Claude in Slack can route bug reports to pull requests." }
    ], function (r) {
      var miss = r.total - r.right;
      finish(r.hearts === 0 ? 1 : CCQ.stars3(miss, 0, 1), "You got " + r.right + " of " + r.total + ". Claude can work everywhere, and now so can you!");
    });
  }
});
  </script>
</body>
</html>
