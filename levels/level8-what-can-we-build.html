<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What Can We Build? | Claude Code Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

</head>
<body>
  <main class="wrap" id="game"></main>
  <footer><a href="../index.html">⟵ Back to the map</a></footer>
  <script src="../js/game.js"></script>
  <script>
CCQ.runLevel({
  id: "l8",
  intro: "Claude Code works with almost any programming language. So what can you build? <b>Lots!</b>",
  story: [
    { emoji: "🌐", title: "Websites and web apps", body: "<p>HTML, CSS and JavaScript pages, React or Vue apps, online shops, school club sites. Try: <i>\"make a one-page site about my cat with a photo gallery\"</i>.</p>" },
    { emoji: "📱", title: "Mobile apps and games", body: "<p>Phone apps (for example with React Native or Flutter), browser games, Python games with Pygame. Try: <i>\"make a snake game in one HTML file\"</i>.</p>" },
    { emoji: "🗄️", title: "Backends, data and tools", body: "<p>APIs and servers, databases, data scripts that turn spreadsheets into charts, command-line tools. Try: <i>\"read scores.csv and draw a bar chart\"</i>.</p>" },
    { emoji: "🤖", title: "AI agents", body: "<p>With the <b>Claude Agent SDK</b> you can build your own AI agents powered by the same tools Claude Code uses, for example a homework-helper bot or a support agent. You can also build apps that call Claude through the <b>Claude API</b>.</p>" },
    { emoji: "⚙️", title: "Automation", body: "<p>Write tests, fix lint errors, update dependencies, write release notes, and run Claude in <b>GitHub Actions</b> or <b>GitLab CI/CD</b>. You can even pipe things in: <code>cat log.txt | claude -p \"what went wrong?\"</code></p>" }
  ],
  play: function (host, finish) {
    CCQ.sort(host,
      ["🌐 Web app", "🎮 Game", "🤖 AI agent", "⚙️ Automation"],
      [
        { t: "A bake-sale website with an order form", bin: 0 },
        { t: "A to-do list page that saves in the browser", bin: 0 },
        { t: "A space shooter in one HTML file", bin: 1 },
        { t: "A Pygame maze with a timer", bin: 1 },
        { t: "A homework-helper bot built with the Agent SDK", bin: 2, why: "Building your own agent = Agent SDK." },
        { t: "A support bot that answers questions from your docs", bin: 2 },
        { t: "Review every pull request in GitHub Actions", bin: 3 },
        { t: "Write tests and fix lint errors across the project", bin: 3 }
      ],
      function (r) { finish(CCQ.stars3(r.mistakes, 1, 3), "Mistakes: " + r.mistakes + ". Your idea notebook is overflowing! 💡"); });
  }
});
  </script>
</body>
</html>
