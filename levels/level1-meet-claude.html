<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet Claude Code | Claude Code Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

</head>
<body>
  <main class="wrap" id="game"></main>
  <footer><a href="../index.html">⟵ Back to the map</a></footer>
  <script src="../js/game.js"></script>
  <script>
CCQ.runLevel({
  id: "l1",
  intro: "Hi! I'm <b>Sparky</b> ⭐ and I'll be your guide. Read the story cards, then answer my quiz. You have 3 hearts!",
  story: [
    { emoji: "🤖", title: "What is Claude Code?", body: "<p><b>Claude Code</b> is an <b>agentic coding tool</b> made by Anthropic. That's a fancy way to say it is an AI helper that can <b>do</b> coding jobs, not just talk about them.</p><p>It can <b>read</b> your project, <b>edit</b> files, <b>run</b> commands and <b>check</b> its own work.</p>" },
    { emoji: "🔁", title: "How does it work?", body: "<p>Claude works in a loop, a bit like a detective:</p><ol><li><b>Look</b>: read files to understand the project.</li><li><b>Act</b>: change code or run a command.</li><li><b>Check</b>: run tests or look at the result.</li></ol><p>It repeats until the job is done, and it asks you before doing risky things.</p>" },
    { emoji: "💬", title: "You talk, Claude codes", body: "<p>You type normal words, like:</p><pre class='code'>make the jump button bigger and pink</pre><p>Claude finds the right file, makes the change, and shows you what it did. You stay the boss: you can say yes, no, or \"try again\".</p>" },
    { emoji: "🧠", title: "Who is it for?", body: "<p>Beginners use it to learn and build their first app. Pros use it to fix bugs, write tests, make pull requests on GitHub and automate boring jobs.</p><p>To use it for real you need a paid Claude plan (Pro, Max, Team or Enterprise) or a Claude Console account.</p>" }
  ],
  play: function (host, finish) {
    CCQ.quiz(host, [
      { q: "What is Claude Code?", choices: ["An agentic coding tool that can read, edit and run code with you", "A video game console", "A spelling checker only", "A type of keyboard"], answer: 0, why: "Claude Code is an AI coding helper that takes actions in your project." },
      { q: "Which company makes Claude Code?", choices: ["Anthropic", "A toy shop", "A pizza place", "Nobody, it grew on a tree"], answer: 0, why: "Anthropic builds Claude and Claude Code." },
      { q: "What are the three steps of Claude's work loop?", choices: ["Look, act, check", "Eat, sleep, repeat", "Copy, paste, hope", "Guess, skip, quit"], answer: 0, why: "Claude gathers context, takes action, then verifies the result." },
      { q: "How do you tell Claude what to do?", choices: ["Type what you want in normal words", "Only by drawing pictures", "You must write binary 0s and 1s", "Shout at the screen"], answer: 0, why: "You describe the task in plain language, called a prompt." },
      { q: "Who is the boss when Claude wants to do something risky?", choices: ["You are! Claude asks for permission", "Claude always decides alone", "The computer mouse", "Nobody"], answer: 0, why: "By default Claude asks before editing files or running commands." },
      { q: "Which of these can Claude Code do?", choices: ["Fix a bug, write tests and make a GitHub pull request", "Bake a real cake", "Walk your dog", "Charge your phone"], answer: 0, why: "Those are all real coding jobs Claude Code can help with." }
    ], function (r) {
      var miss = r.total - r.right;
      finish(r.hearts === 0 ? 1 : CCQ.stars3(miss, 0, 1), "You got " + r.right + " of " + r.total + " right. You now know what Claude Code is!");
    });
  }
});
  </script>
</body>
</html>
