<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boss Level | Claude Code Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="wrap" id="game"></main>
  <footer><a href="../index.html">⟵ Back to the map</a></footer>
  <script src="../js/game.js"></script>
  <script>
CCQ.runLevel({
  id: "l9",
  intro: "The <b>Code Dragon</b> 🐉 guards the golden badge! Answer its questions using everything you learned.",
  story: [
    { emoji: "🐉", title: "The final challenge", body: "<p>10 questions from every level. You have 3 hearts. Get through to unlock your <b>Claude Code Explorer</b> certificate!</p>" }
  ],
  play: function (host, finish) {
    CCQ.quiz(host, [
      { q: "Do you need an IDE to use Claude Code?", choices: ["No, any terminal works. IDE extensions are optional", "Yes, only VS Code works", "Yes, only JetBrains works", "Yes, you must buy a special IDE"], answer: 0, why: "The CLI runs in any terminal; VS Code and JetBrains integrations are extras." },
      { q: "Which JetBrains IDE is supported by the Claude Code plugin?", choices: ["PyCharm", "Microsoft Paint", "Notepad", "Calculator"], answer: 0, why: "IntelliJ IDEA, PyCharm, Android Studio, WebStorm, PhpStorm, GoLand and more." },
      { q: "What command starts Claude Code in a terminal?", choices: ["claude", "start-ai", "python claude.py", "open sesame"], answer: 0, why: "Type claude inside your project folder." },
      { q: "What does <code>/init</code> do?", choices: ["Creates a CLAUDE.md file about your project", "Deletes your project", "Restarts the computer", "Plays music"], answer: 0, why: "/init writes a starter CLAUDE.md." },
      { q: "Which key cycles permission modes, including plan mode?", choices: ["Shift+Tab", "Caps Lock", "F12", "Spacebar"], answer: 0, why: "Shift+Tab switches modes in the CLI." },
      { q: "Something runs a formatter automatically after every edit. What is it?", choices: ["A hook", "An artifact", "A routine", "A Project"], answer: 0, why: "Hooks run commands at set moments in Claude's work." },
      { q: "Which open standard connects Claude to tools like Google Drive or Jira?", choices: ["MCP (Model Context Protocol)", "HTTP Cats", "JPEG", "Bluetooth"], answer: 0, why: "MCP servers plug outside tools into Claude." },
      { q: "How do you go back to before Claude's last edits?", choices: ["/rewind or press Esc twice", "Unplug the computer", "Type /init again", "Close your eyes"], answer: 0, why: "Checkpoints + rewind restore code and chat." },
      { q: "What runs your prompt on a schedule in the cloud, even when your laptop is off?", choices: ["A routine", "A subagent", "CLAUDE.md", "Plan mode"], answer: 0, why: "Routines run on cloud infrastructure on schedules or triggers." },
      { q: "What do you use to build your OWN AI agent with Claude Code's tools?", choices: ["The Claude Agent SDK", "A screenshot", "/clear", "A JetBrains theme"], answer: 0, why: "The Agent SDK lets you build custom agents." }
    ], function (r) {
      var miss = r.total - r.right;
      if (r.hearts > 0) {
        var name = "";
        try { name = localStorage.getItem("ccq-name") || ""; } catch (e) {}
        var input = CCQ.el("input", { "aria-label": "Your name", placeholder: "Type your name", value: name });
        input.addEventListener("input", function () { try { localStorage.setItem("ccq-name", input.value); } catch (e) {} });
        host.appendChild(CCQ.el("div", { class: "panel cert" }, [
          CCQ.el("div", { style: "font-size:3rem", text: "🏅" }),
          CCQ.el("h2", { text: "Certificate of Awesomeness" }),
          CCQ.el("p", { text: "This certifies that" }),
          input,
          CCQ.el("p", { html: "beat the Code Dragon and is now an official<br><b style='font-size:1.4rem'>Claude Code Explorer</b>" }),
          CCQ.el("p", { style: "color:var(--ink-soft)", text: "Stars collected: " + CCQ.totalStars() + " • " + new Date().toLocaleDateString() }),
          CCQ.el("div", { class: "btn-row" }, [CCQ.el("button", { class: "btn sky", text: "🖨️ Print certificate", onclick: function () { window.print(); } })])
        ]));
      }
      finish(r.hearts === 0 ? 1 : CCQ.stars3(miss, 0, 2), r.hearts === 0
        ? "The dragon won this time. Review the levels and try again!"
        : "You beat the Code Dragon! Close this box to see your certificate, then try the real challenges.");
    });
  }
});
  </script>
</body>
</html>
