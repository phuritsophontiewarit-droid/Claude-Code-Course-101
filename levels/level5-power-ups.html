<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power-Up Memory | Claude Code Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="wrap" id="game"></main>
  <footer><a href="../index.html">⟵ Back to the map</a></footer>
  <script src="../js/game.js"></script>
  <script>
CCQ.runLevel({
  id: "l5",
  intro: "Claude Code has <b>power-ups</b> that make it smarter for YOUR project. Learn them, then play memory!",
  story: [
    { emoji: "📒", title: "CLAUDE.md: the project notebook", body: "<p><code>CLAUDE.md</code> is a file in your project that Claude reads at the start of <b>every</b> session. Put rules there like <i>\"use 2 spaces\"</i> or <i>\"run npm test to test\"</i>.</p><p><code>/init</code> writes a first version for you. Claude also keeps <b>auto memory</b> of things it learns.</p>" },
    { emoji: "🪄", title: "Skills: saved recipes", body: "<p>A <b>skill</b> is a packaged set of instructions (a <code>SKILL.md</code> file) for a job you repeat, like <code>/review-pr</code> or <code>/deploy</code>. Type <code>/</code> and its name to use it, or Claude uses it when it fits.</p>" },
    { emoji: "🪝", title: "Hooks: automatic triggers", body: "<p>A <b>hook</b> runs a shell command automatically at a moment in Claude's work, for example <b>after every file edit</b> (auto-format the code) or <b>before a command</b> runs (block something dangerous).</p>" },
    { emoji: "👯", title: "Subagents: helper teammates", body: "<p>A <b>subagent</b> is a helper Claude with its own fresh workspace and job, like a <i>tester</i> or <i>code reviewer</i>. The main Claude sends it a task and gets a summary back, so the main chat stays tidy.</p>" },
    { emoji: "🔌", title: "MCP and plugins", body: "<p><b>MCP</b> (Model Context Protocol) is an open standard that plugs Claude into other tools: Google Drive, Jira, Slack, databases and more. Manage them with <code>/mcp</code>.</p><p>A <b>plugin</b> is a gift box that bundles skills, agents, hooks and MCP servers so you can share them with friends.</p>" }
  ],
  play: function (host, finish) {
    CCQ.memory(host, [
      ["📒 CLAUDE.md", "Rules Claude reads every session"],
      ["🪄 Skill", "Saved recipe you call with /name"],
      ["🪝 Hook", "Runs a command automatically after an edit"],
      ["👯 Subagent", "Helper Claude with its own job"],
      ["🔌 MCP", "Plugs Claude into other tools"],
      ["🎁 Plugin", "Bundle of skills, hooks and agents to share"]
    ], function (r) {
      finish(CCQ.stars3(r.moves, 10, 15), "You finished in " + r.moves + " moves. Your toolbox is full of power-ups!");
    });
  }
});
  </script>
</body>
</html>
