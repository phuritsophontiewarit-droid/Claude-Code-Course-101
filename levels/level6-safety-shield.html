<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safety Shield | Claude Code Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="wrap" id="game"></main>
  <footer><a href="../index.html">⟵ Back to the map</a></footer>
  <script src="../js/game.js"></script>
  <script>
CCQ.runLevel({
  id: "l6",
  intro: "Superheroes use their powers carefully. Claude Code has <b>shields</b> so you always stay in control.",
  story: [
    { emoji: "🙋", title: "Permission modes", body: "<p>Press <b>Shift+Tab</b> to switch how much Claude asks first:</p><ul><li><b>Manual</b> (default): asks before editing files or running commands</li><li><b>Accept edits</b>: edits files without asking, still asks for commands</li><li><b>Plan</b>: only reads and plans, changes nothing until you approve</li><li><b>Auto</b>: a safety checker approves routine actions and blocks risky ones</li></ul>" },
    { emoji: "⏪", title: "Rewind time", body: "<p>Claude saves <b>checkpoints</b> of its file edits. Press <b>Esc twice</b> (with an empty prompt) or type <code>/rewind</code> to go back to an earlier moment, for the code, the chat, or both.</p>" },
    { emoji: "✋", title: "Stop button", body: "<p>Claude going the wrong way? Press <b>Esc</b> once to stop it right away, then tell it what you want instead.</p>" },
    { emoji: "🔐", title: "Golden safety rules", body: "<ul><li>Use <b>git</b> so every change can be undone.</li><li>Never paste passwords or secret keys into chats or code.</li><li>Read what Claude did before you share it.</li><li>Kids: always code with a grown-up nearby.</li></ul>" }
  ],
  play: function (host, finish) {
    CCQ.sort(host,
      ["🗺️ Plan mode", "🙋 Manual mode", "⏪ Rewind", "✋ Press Esc"],
      [
        { t: "I want Claude to think up a plan for a big new feature before touching any files", bin: 0, why: "Planning without editing is plan mode." },
        { t: "I'm brand new and want to approve every single change", bin: 1, why: "Manual mode asks before each edit or command." },
        { t: "Claude's last 3 edits broke my game, go back!", bin: 2, why: "Checkpoints let you /rewind to before the edits." },
        { t: "Claude is editing the wrong file right now", bin: 3, why: "Esc stops Claude immediately." },
        { t: "Explore a big project and propose changes, read-only", bin: 0, why: "Read and propose = plan mode." },
        { t: "Working on something sensitive, I want to see each command first", bin: 1, why: "Manual mode lets you review every action." },
        { t: "Undo the conversation AND the code to 10 minutes ago", bin: 2, why: "The rewind menu can restore both." },
        { t: "Oops, I asked for the wrong thing and Claude just started", bin: 3, why: "Interrupt with Esc, then re-ask." }
      ],
      function (r) { finish(CCQ.stars3(r.mistakes, 1, 3), "Mistakes: " + r.mistakes + ". Your safety shield is fully charged! 🛡️"); });
  }
});
  </script>
</body>
</html>
