<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Install Quest | Claude Code Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="wrap" id="game"></main>
  <footer><a href="../index.html">⟵ Back to the map</a></footer>
  <script src="../js/game.js"></script>
  <script>
CCQ.runLevel({
  id: "l3",
  intro: "Time to type! This is a <b>pretend</b> terminal, so nothing on your computer changes. Practise the real commands here first.",
  story: [
    { emoji: "📦", title: "Installing Claude Code", body: "<p>On <b>macOS, Linux or WSL</b> the recommended install is:</p><pre class='code'>curl -fsSL https://claude.ai/install.sh | bash</pre><p>On <b>Windows PowerShell</b>:</p><pre class='code'>irm https://claude.ai/install.ps1 | iex</pre><p>You can also use <code>brew install --cask claude-code</code> or <code>winget install Anthropic.ClaudeCode</code>.</p>" },
    { emoji: "✅", title: "Check it worked", body: "<p>Open a new terminal and run:</p><pre class='code'>claude --version</pre><p>If you see a version number, you're ready!</p>" },
    { emoji: "📁", title: "Start in your project", body: "<p>Go into your project folder and start Claude:</p><pre class='code'>cd my-game\nclaude</pre><p>The first time, Claude asks you to log in.</p>" },
    { emoji: "🪄", title: "Handy slash commands", body: "<p>Inside Claude, commands start with <code>/</code>:</p><ul><li><code>/init</code> makes a <b>CLAUDE.md</b> file describing your project</li><li><code>/help</code> shows help</li><li><code>/clear</code> starts a fresh chat</li><li><code>/compact</code> shrinks a long chat to save room</li></ul>" }
  ],
  play: function (host, finish) {
    CCQ.terminal(host, [
      { task: "Install Claude Code on a Mac with the recommended one-line installer.", hint: "curl -fsSL https://claude.ai/install.sh | bash", accept: ["curl -fsSL https://claude.ai/install.sh | bash"], reply: ["Downloading Claude Code...", "Installed! Open a new terminal."] },
      { task: "Check that the install worked by asking for the version.", hint: "claude --version", accept: ["claude --version", "claude -v"], reply: ["2.x.x (Claude Code)"] },
      { task: "Move into the folder called <code>my-game</code>.", hint: "cd my-game", accept: ["cd my-game", "cd my-game/", "cd ./my-game"] },
      { task: "Start Claude Code.", hint: "Just type the tool's name: claude", accept: ["claude"], reply: ["✻ Welcome to Claude Code!", "Ask me anything about my-game."] },
      { prompt: ">", task: "Ask Claude to create a CLAUDE.md memory file for your project.", hint: "/init", accept: ["/init"], reply: ["I looked around your project and wrote CLAUDE.md with how to run and test it."] },
      { prompt: ">", task: "Ask Claude, in plain words, to explain what this project does.", hint: "Type a sentence with the word explain, e.g. explain this project", accept: [/explain|what does|tell me about|describe/i], reply: ["This is a jumping game written in HTML and JavaScript. main.js holds the player code..."] },
      { prompt: ">", task: "Start a fresh, empty conversation.", hint: "/clear", accept: ["/clear"], reply: ["(conversation cleared)"] }
    ], function (r) {
      finish(CCQ.stars3(r.hints, 1, 3), "Hints used: " + r.hints + ". You can install and start Claude Code like a pro!");
    });
  }
});
  </script>
</body>
</html>
